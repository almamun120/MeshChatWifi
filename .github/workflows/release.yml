name: Release (signed APK)

# Run by pushing a tag such as v1.0.0, or manually from the Actions tab.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name, e.g. 1.0.0 (manual runs only)'
        required: true
        default: '1.0.0'

permissions:
  contents: write   # needed to create the GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VERSION_NAME: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x gradlew

      - name: Check signing secrets exist
        env:
          KS: ${{ secrets.MESHCHAT_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.MESHCHAT_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.MESHCHAT_KEY_ALIAS }}
          KP: ${{ secrets.MESHCHAT_KEY_PASSWORD }}
        run: |
          for v in KS KSP KA KP; do
            if [ -z "${!v}" ]; then
              echo "::error::Missing repository secret for $v. See docs/RELEASE_SIGNING.md"
              exit 1
            fi
          done

      - name: Decode keystore
        env:
          KS: ${{ secrets.MESHCHAT_KEYSTORE_BASE64 }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "MESHCHAT_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Build signed release APK
        env:
          MESHCHAT_KEYSTORE_PASSWORD: ${{ secrets.MESHCHAT_KEYSTORE_PASSWORD }}
          MESHCHAT_KEY_ALIAS: ${{ secrets.MESHCHAT_KEY_ALIAS }}
          MESHCHAT_KEY_PASSWORD: ${{ secrets.MESHCHAT_KEY_PASSWORD }}
        run: |
          V="${VERSION_NAME#v}"
          ./gradlew --no-daemon :app:assembleRelease \
            -PversionName="$V" -PversionCode="${{ github.run_number }}"

      - name: Verify the APK is signed
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          echo "APK: $APK"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          V="${VERSION_NAME#v}"
          cp "$APK" "MeshChat-$V.apk"
          sha256sum "MeshChat-$V.apk" | tee "MeshChat-$V.apk.sha256"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeshChat-signed-apk
          path: |
            MeshChat-*.apk
            MeshChat-*.apk.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'push' && github.ref_name || format('v{0}', inputs.version) }}
          name: MeshChat ${{ env.VERSION_NAME }}
          generate_release_notes: true
          files: |
            MeshChat-*.apk
            MeshChat-*.apk.sha256
